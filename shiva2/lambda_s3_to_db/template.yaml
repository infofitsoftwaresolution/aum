AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: S3 -> Lambda -> PostgreSQL ingestion for DAT files

Parameters:
  SourceBucketName:
    Type: String
    Description: Existing bucket where DAT files are uploaded
  SourcePrefix:
    Type: String
    Default: "Fidelity/"
    Description: Optional S3 key prefix filter for trigger

Resources:
  DatFileIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      Timeout: 120
      MemorySize: 512
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref SourceBucketName
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: "*"
      Events:
        NewObjectEvent:
          Type: S3
          Properties:
            Bucket: !Ref SourceBucketName
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: !Ref SourcePrefix
